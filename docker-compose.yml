version: '3.9'

services:
  redis:
    image: redis:7
    container_name: warmest-redis
    ports:
      - "6379:6379"

  app1:
    build: .
    container_name: warmest-app-1
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - WARMEST_BACKEND=redis
    depends_on:
      - redis

  app2:
    build: .
    container_name: warmest-app-2
    ports:
      - "8081:8080"
    environment:
      - SERVER_PORT=8080
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - WARMEST_BACKEND=redis
    depends_on:
      - redis

  app3:
    build: .
    container_name: warmest-app-3
    ports:
      - "8082:8080"
    environment:
      - SERVER_PORT=8080
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - WARMEST_BACKEND=redis
    depends_on:
      - redis