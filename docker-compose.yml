
x-app: &app
  build: .
  image: warmest-app:local
  environment:
    SERVER_PORT: 8080
    SPRING_DATA_REDIS_HOST: redis
    SPRING_DATA_REDIS_PORT: 6379
    WARMEST_BACKEND: redis
  depends_on:
    redis:
      condition: service_healthy
  restart: unless-stopped

services:

  redis:
    image: redis:7-alpine
    container_name: warmest-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  app1:
    <<: *app
    container_name: warmest-app-1
    ports:
      - "8080:8080"

  app2:
    <<: *app
    container_name: warmest-app-2
    ports:
      - "8081:8080"

  app3:
    <<: *app
    container_name: warmest-app-3
    ports:
      - "8082:8080"